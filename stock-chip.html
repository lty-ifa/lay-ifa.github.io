<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股籌碼雷達</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #101827;
      --ink: #eef6ff;
      --muted: #91a0b5;
      --line: #26354a;
      --green: #35d39a;
      --red: #ff6b81;
      --blue: #5bbcff;
      --amber: #f6c85f;
      --purple: #9f8cff;
      --soft-green: #102a24;
      --soft-red: #2b1820;
      --soft-blue: #13263a;
      --soft-amber: #2d2819;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      padding: 10px 2px 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 16px;
    }

    .brand-copy {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding-left: 16px;
      border-left: 1px solid rgba(91, 188, 255, 0.3);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: #181b20;
    }

    .subline {
      color: #596273;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .data-notice {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border: 1px solid rgba(242, 184, 91, 0.42);
      border-radius: 999px;
      color: #e8bd73;
      background: rgba(242, 184, 91, 0.09);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .page-notice {
      display: flex;
      justify-content: center;
      margin-top: 24px;
      padding: 4px 0 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(91, 188, 255, 0.38);
      border-radius: 9px;
      color: #dff6ff;
      background: rgba(91, 188, 255, 0.08);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .home-link:hover {
      border-color: rgba(91, 188, 255, 0.75);
      background: rgba(91, 188, 255, 0.15);
      transform: translateY(-1px);
    }

    .live-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font: 750 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-mark::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 16px currentColor;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    .dashboard-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .dashboard-controls h2 {
      margin: 0;
      color: #181b20;
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -0.01em;
    }

    .result-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .dashboard-controls p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .refresh-all {
      min-width: 180px;
      background: #1f3a5f;
      border: 1px solid #1f3a5f;
      box-shadow: none;
    }

    .result-section {
      scroll-margin-top: 18px;
      margin-top: 20px;
      padding: 0;
      border: 0;
      border-radius: 0;
      overflow: visible;
      background: none;
    }

    .strong-zone {
      box-shadow: none;
    }

    .result-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 28px 2px 10px;
      padding-bottom: 9px;
      border-bottom: 2px solid #1f3a5f;
    }

    .result-heading span {
      color: #6b7280;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .strong-zone .result-title { color: #181b20; }

    .strong-zone .rank-no { color: #6b7280; }

    .hidden-controls { display: none; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 16px;
      position: sticky;
      top: 14px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 11px;
      color: var(--ink);
      background: #ffffff;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #e7ebf0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-2.is-single {
      grid-template-columns: 1fr;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .primary, .secondary {
      min-height: 44px;
      border-radius: 9px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 800;
      border: 0;
      color: #fff;
      transition: filter 0.16s ease, transform 0.16s ease;
    }

    .primary {
      background: var(--blue);
    }

    .secondary {
      background: #1f3a5f;
    }

    .action-query { background: var(--blue); }
    .action-strong { background: var(--green); }

    .primary.is-active,
    .secondary.is-active {
      box-shadow: 0 0 0 3px #e7ebf0;
      filter: brightness(0.95);
    }

    .mode-form {
      display: none;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .mode-form.is-open {
      display: block;
    }

    .mode-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 850;
    }

    .field.is-hidden {
      display: none;
    }

    .execute-button {
      width: 100%;
      margin-top: 2px;
    }

    .primary:hover:not(:disabled),
    .secondary:hover:not(:disabled) {
      filter: brightness(0.94);
      transform: translateY(-1px);
    }

    .primary:disabled,
    .secondary:disabled {
      cursor: progress;
    }

    .status {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 12px;
      min-height: 44px;
      border-left: 3px solid #1f3a5f;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      min-height: 92px;
      padding: 14px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
      overflow-wrap: anywhere;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .neutral { color: var(--muted); }

    .card {
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: none;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      color: #181b20;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.015em;
    }

    .card-sub {
      color: #596273;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 550;
      margin-top: 5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.good {
      color: var(--green);
      border-color: #087a55;
      background: var(--soft-green);
    }

    .badge.bad {
      color: var(--red);
      border-color: #c2414b;
      background: var(--soft-red);
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    .cell {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      padding: 10px;
      min-height: 70px;
    }

    .cell span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .cell strong {
      display: block;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .signal {
      border-left: 5px solid var(--blue);
      background: #ffffff;
    }

    .signal.good {
      border-left-color: var(--green);
      background: #ffffff;
    }

    .signal.bad {
      border-left-color: var(--red);
      background: #ffffff;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .context-box {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      padding: 11px;
    }

    .context-box span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .context-box strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .context-box p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .ranking {
      display: grid;
      gap: 8px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 10px;
      align-items: center;
      border: 2px solid #c8cdd4;
      border-radius: 7px;
      padding: 12px;
      background: #ffffff;
    }

    .rank-row.strong-detail {
      grid-template-columns: 54px minmax(0, 1fr);
      align-items: start;
    }

    .rank-no {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .rank-main strong,
    .rank-side strong {
      display: block;
    }

    .rank-main > strong {
      color: #181b20;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 900;
    }

    .rank-main span,
    .rank-side span {
      color: var(--muted);
      font-size: 12px;
    }

    .strong-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .strong-cell {
      border: 1px solid #e3e3df;
      border-radius: 6px;
      padding: 10px;
      background: #f8f8f6;
      min-height: 58px;
    }

    .signal-hero {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .hero-stat {
      padding: 12px;
      border: 1px solid #d7dce3;
      border-radius: 7px;
      background: #ffffff;
    }

    .hero-stat.primary-stat {
      border-left: 4px solid #1f3a5f;
    }

    .hero-stat span,
    .group-value span,
    .financing-row span {
      display: block;
      color: #596273;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .hero-stat strong {
      display: block;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .streak-days {
      color: #ff9f43;
    }

    .detail-groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .detail-group {
      padding: 10px;
      border: 1px solid #e3e3df;
      border-radius: 7px;
      background: #f8f8f6;
    }

    .detail-group h4 {
      margin: 0 0 8px;
      color: #181b20;
      font-size: 13px;
      font-weight: 900;
    }

    .group-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .streak-values {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .group-value strong {
      display: block;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .financing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      padding: 8px 10px;
      border-top: 1px solid #deded9;
    }

    .financing-row span { margin: 0; }
    .financing-row strong { font-size: 13px; }

    .strong-cell > span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .strong-cell strong {
      display: block;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .strong-split {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .strong-split b {
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 36px 18px;
      color: var(--muted);
    }

    /* Dark technology theme */
    h1,
    .dashboard-controls h2,
    .card-title,
    .rank-main > strong,
    .detail-group h4 {
      color: #eef6ff;
    }

    .subline,
    .card-sub,
    .result-heading span,
    .strong-zone .rank-no,
    .hero-stat span,
    .group-value span,
    .financing-row span {
      color: #91a0b5;
    }

    .refresh-all,
    .primary,
    .secondary {
      color: #070b14;
      background: #5bbcff;
      border-color: #5bbcff;
      box-shadow: none;
    }

    .result-heading {
      border-bottom-color: #5bbcff;
    }

    .strong-zone .result-title {
      color: #eef6ff;
    }

    input,
    .badge,
    .cell,
    .context-box,
    .signal,
    .signal.good,
    .signal.bad,
    .hero-stat {
      color: #eef6ff;
      background: #101827;
      border-color: #26354a;
    }

    input:focus,
    .primary.is-active,
    .secondary.is-active {
      box-shadow: 0 0 0 3px #13263a;
    }

    .status {
      border-left-color: #5bbcff;
    }

    .badge.good {
      color: #35d39a;
      border-color: #35d39a;
      background: #102a24;
    }

    .badge.bad {
      color: #ff6b81;
      border-color: #ff6b81;
      background: #2b1820;
    }

    .rank-row {
      border-color: #34465e;
      background: #0d1522;
    }

    .strong-cell,
    .detail-group {
      color: #eef6ff;
      border-color: #26354a;
      background: #0d1522;
    }

    .hero-stat.primary-stat {
      border-left-color: #5bbcff;
    }

    .financing-row {
      border-top-color: #26354a;
    }

    /* Lighter typography */
    body { font-weight: 400; }
    h1 { font-weight: 600; }
    strong, b { font-weight: 600; }

    .dashboard-controls h2,
    .result-title,
    .card-title,
    .rank-main > strong,
    .hero-stat strong,
    .detail-group h4 {
      font-weight: 700;
    }

    .subline,
    .dashboard-controls p,
    .card-sub,
    .status {
      font-weight: 400;
    }

    button,
    .badge,
    .rank-no,
    .group-value strong,
    .financing-row strong {
      font-weight: 600;
    }

    .result-heading span,
    .hero-stat span,
    .group-value span,
    .financing-row span,
    .strong-cell > span {
      font-weight: 500;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .controls { position: static; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .data-grid, .strong-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .app { width: min(100% - 16px, 1120px); padding: 10px 0 28px; }
      .topbar { align-items: flex-end; margin-bottom: 14px; padding: 8px 4px 14px; }
      .brand-lockup { display: grid; gap: 7px; }
      .brand-copy { gap: 7px; padding-left: 0; border-left: 0; }
      h1 { font-size: 28px; }
      .subline { font-size: 10px; }
      .data-notice { padding: 4px 7px; font-size: 9px; }
      .header-actions { gap: 0; }
      .home-link { min-height: 32px; padding: 0 10px; font-size: 11px; }
      .card-head { flex-direction: column; align-items: stretch; }
      .live-mark { display: none; }
      .grid-2, .actions, .data-grid, .context-grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .metric { min-height: 72px; padding: 11px; }
      .metric strong { font-size: 17px; margin-top: 3px; }
      .metric span { font-size: 10px; }
      .status { font-size: 12px; min-height: 40px; margin-bottom: 8px; }
      .result-section { margin-top: 14px; padding: 0; border-radius: 0; }
      .result-heading { align-items: baseline; padding: 0 3px; }
      .result-title { font-size: 19px; }
      .result-heading span { font-size: 9px; }
      .card { padding: 12px 8px; }
      .card-title { font-size: 18px; }
      .card-sub { font-size: 11px; line-height: 1.45; }
      .ranking { gap: 7px; }
      .rank-row, .rank-row.strong-detail { grid-template-columns: 30px minmax(0, 1fr); gap: 5px; padding: 8px 6px; }
      .rank-no { font-size: 11px; }
      .strong-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .strong-cell { padding: 8px; min-height: 56px; }
      .strong-cell > span { font-size: 10px; }
      .strong-cell strong, .strong-split b { font-size: 12px; }
      .signal-hero { gap: 6px; }
      .hero-stat { padding: 10px 8px; }
      .hero-stat strong { font-size: 20px; }
      .detail-groups { grid-template-columns: 1fr; gap: 6px; }
      .detail-group { padding: 8px; }
      .group-values { gap: 6px; }
      .group-value strong { font-size: 13px; }
      .rank-side { grid-column: 2; }
      .dashboard-controls { align-items: stretch; flex-direction: column; gap: 12px; padding: 14px; margin-bottom: 10px; }
      .dashboard-controls p { font-size: 12px; }
      .refresh-all { width: 100%; min-height: 48px; }
    }

    /* Neon technology theme */
    body {
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 4%, rgba(0, 229, 255, 0.14), transparent 28rem),
        radial-gradient(circle at 90% 18%, rgba(112, 92, 255, 0.12), transparent 26rem),
        linear-gradient(145deg, #050914 0%, #080f1d 48%, #050a13 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(91, 188, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 188, 255, 0.1) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
    }

    .app { position: relative; z-index: 1; }

    .topbar {
      border-bottom-color: rgba(91, 188, 255, 0.5);
      box-shadow: 0 14px 28px -24px rgba(0, 229, 255, 0.9);
    }

    h1 {
      color: #f4fbff;
      background: linear-gradient(90deg, #fff, #8eeaff 58%, #aea5ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 28px rgba(91, 188, 255, 0.2);
    }

    .subline { color: #90a9c5; }
    .live-mark { text-shadow: 0 0 12px rgba(53, 211, 154, 0.65); }

    .live-mark::before {
      box-shadow: 0 0 7px currentColor, 0 0 22px currentColor;
      animation: neonPulse 2.2s ease-in-out infinite;
    }

    .panel,
    .rank-row,
    .cell,
    .context-box,
    .strong-cell,
    .hero-stat,

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-lockup">
        <h1>台股籌碼雷達</h1>
        <div class="brand-copy">
          <div class="subline">外資投信 · 連續買超 · 含 ETF</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="live-mark">Market Intelligence</div>
        <a class="home-link" href="index.html">回首頁</a>
      </div>
    </header>

    <section class="layout">
      <section>
        <div class="panel dashboard-controls">
          <div>
            <h2>每日法人連買掃描</h2>
            <p>找出外資或投信連續買超的股票與 ETF，最新日買超量超過 500 張，並列出前 15 檔。</p>
          </div>
          <button id="refreshAllButton" class="primary refresh-all">更新全部資訊</button>
        </div>

        <div class="panel status" id="statusText">按下更新按鈕，取得最新排行。</div>

        <section class="result-section strong-zone" aria-labelledby="maCrossResultTitle">
          <div class="result-heading">
            <h2 class="result-title" id="maCrossResultTitle">外資投信連買標的</h2>
            <span>FOREIGN + TRUST BUYING</span>
          </div>
          <div id="maCrossResult"><div class="panel empty">尚未更新</div></div>
        </section>

        <section class="result-section strong-zone" aria-labelledby="etfChangeTitle">
          <div class="result-heading">
            <h2 class="result-title" id="etfChangeTitle">00981A 持股變化</h2>
            <span>DAILY HOLDING CHANGE</span>
          </div>
          <div id="etfChangeResult"><div class="panel empty">尚未更新</div></div>
        </section>

      </section>
    </section>
    <footer class="page-notice">
      <div class="data-notice">公開資料整理，僅供參考使用</div>
    </footer>
  </main>

  <script>
    const INST_API = "https://www.twse.com.tw/rwd/zh/fund/T86";
    const ETF_CHANGE_SOURCE = "https://r.jina.ai/http://zdsetf.com/etf/00981A";
    const LOOKBACK_DAYS = 14;

    const els = {
      status: document.getElementById("statusText"),
      refreshAll: document.getElementById("refreshAllButton"),
      maCrossResult: document.getElementById("maCrossResult"),
      etfChangeResult: document.getElementById("etfChangeResult"),
    };

    function fmtNum(value) {
      if (!Number.isFinite(value)) return "--";
      return new Intl.NumberFormat("zh-TW").format(Math.round(value));
    }

    function toNum(value) {
      const normalized = String(value ?? "").replace(/,/g, "").trim();
      const number = Number(normalized);
      return Number.isFinite(number) ? number : 0;
    }

    function signedLots(shares) {
      if (!Number.isFinite(shares)) return "--";
      const lots = shares / 1000;
      const prefix = lots > 0 ? "+" : "";
      return `${prefix}${new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 2 }).format(lots)} 張`;
    }

    function addDays(ymd, offset) {
      const date = new Date(`${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6, 8)}T12:00:00`);
      date.setDate(date.getDate() + offset);
      return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, "0")}${String(date.getDate()).padStart(2, "0")}`;
    }

    function todayYmd() {
      const now = new Date();
      return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function recentWeekdayDates(count) {
      const dates = [];
      let date = todayYmd();
      while (dates.length < count) {
        const weekday = new Date(`${date.slice(0, 4)}-${date.slice(4, 6)}-${date.slice(6, 8)}T12:00:00`).getDay();
        if (weekday !== 0 && weekday !== 6) dates.push(date);
        date = addDays(date, -1);
      }
      return dates;
    }

    function displayDate(ymd) {
      return /^\d{8}$/.test(ymd) ? `${ymd.slice(4, 6)}/${ymd.slice(6, 8)}` : ymd;
    }

    function normalizeInstitutional(data) {
      if (!data || data.stat !== "OK" || !Array.isArray(data.fields) || !Array.isArray(data.data)) return null;
      const index = Object.fromEntries(data.fields.map((field, i) => [field, i]));
      const foreignField = data.fields.find((field) => field.startsWith("外陸資買賣超股數"));
      const trustField = data.fields.find((field) => field.includes("投信買賣超股數"));
      if (!foreignField || !trustField || index["證券代號"] == null || index["證券名稱"] == null) return null;
      const rows = data.data.map((row) => ({
        code: String(row[index["證券代號"]] || "").trim(),
        name: String(row[index["證券名稱"]] || "").trim(),
        foreign: toNum(row[index[foreignField]]),
        trust: toNum(row[index[trustField]]),
      })).filter((row) => /^(?:\d{4,6}|\d{4,5}[A-Z])$/.test(row.code));
      return { date: String(data.date || ""), rows };
    }

    async function fetchInstitutionalDay(date) {
      const url = new URL(INST_API);
      url.searchParams.set("response", "json");
      url.searchParams.set("date", date);
      // ALLBUT0999 保留股票與 ETF，但排除大量權證資料，降低連續請求被限流的機率。
      url.searchParams.set("selectType", "ALLBUT0999");
      const response = await fetch(url);
      if (!response.ok) throw new Error(`法人資料暫時無法取得（HTTP ${response.status}）`);
      return normalizeInstitutional(await response.json());
    }

    async function fetchRecentInstitutionalDays(count) {
      const days = [];
      const requestDates = recentWeekdayDates(count);
      for (let index = 0; index < requestDates.length; index += 1) {
        const date = requestDates[index];
        try {
          const day = await fetchInstitutionalDay(date);
          if (day?.rows.length) days.push(day);
        } catch (error) {
          // 休市日或當日資料尚未公布時，記錄為未取得，不再額外往前搜尋。
        }
        if (index < requestDates.length - 1) await wait(220);
      }
      return days.reverse();
    }

    function collectStreak(days, maps, code, field) {
      const streak = [];
      for (let i = days.length - 1; i >= 0; i -= 1) {
        const row = maps[i].get(code);
        if (!row || row[field] <= 0) break;
        streak.push({ date: days[i].date, shares: row[field] });
      }
      return streak;
    }

    function findConsecutiveBuys(days) {
      const maps = days.map((day) => new Map(day.rows.map((row) => [row.code, row])));
      const latestRows = days[days.length - 1]?.rows || [];
      const results = [];
      for (const latest of latestRows) {
        const foreignStreak = collectStreak(days, maps, latest.code, "foreign");
        const trustStreak = collectStreak(days, maps, latest.code, "trust");
        if (foreignStreak.length < 2 && trustStreak.length < 2) continue;
        const latestBuyShares = Math.max(0, latest.foreign) + Math.max(0, latest.trust);
        if (latestBuyShares <= 500000) continue;
        results.push({
          code: latest.code,
          name: latest.name,
          foreignStreak,
          trustStreak,
          latestBuyShares,
        });
      }
      return results
        .sort((a, b) => b.latestBuyShares - a.latestBuyShares)
        .slice(0, 15);
    }

    async function showConsecutiveBuys() {
      els.maCrossResult.innerHTML = `<div class="panel empty">正在取得最近 ${LOOKBACK_DAYS} 個交易日法人資料…</div>`;
      try {
        const days = await fetchRecentInstitutionalDays(LOOKBACK_DAYS);
        if (days.length < 2) throw new Error(`法人資料只取得 ${days.length} 個交易日，請稍後重試`);
        const rows = findConsecutiveBuys(days);
        if (!rows.length) {
          els.maCrossResult.innerHTML = `<div class="panel empty">目前沒有同時符合「外資或投信連買至少 2 天」與「最新日買超超過 500 張」的標的</div>`;
          return;
        }
        els.maCrossResult.innerHTML = `
          <article class="compact-list">
            <div class="compact-list-head">
              <div class="card-sub">含股票與 ETF；外資、投信分開計算，任一方從最新交易日起連買至少 2 天即入選。最新日兩者正買超量合計必須超過 500 張，再依該數量排序取前 15 檔。</div>
              <span class="badge good">TOP ${rows.length}</span>
            </div>
            ${rows.map((row, index) => `
              <div class="stock-list-row">
                <div class="stock-list-rank">#${index + 1}</div>
                <div class="stock-list-name">
                  <strong>${row.code} ${row.name}</strong>
                  <span>${row.foreignStreak.length >= 2 ? `外資連買 ${row.foreignStreak.length} 天` : ""}${row.foreignStreak.length >= 2 && row.trustStreak.length >= 2 ? " · " : ""}${row.trustStreak.length >= 2 ? `投信連買 ${row.trustStreak.length} 天` : ""}</span>
                </div>
                <div class="stock-list-metrics">
                  <div class="stock-list-metric flow-summary"><span>最新日排序買超量</span><strong class="positive">${signedLots(row.latestBuyShares)}</strong></div>
                </div>
                ${row.foreignStreak.length >= 2 ? `
                  <div class="stock-list-daily">
                    <div class="stock-list-daily-title">外資連買 ${row.foreignStreak.length} 天</div>
                    ${row.foreignStreak.map((day) => `
                      <div class="stock-list-daily-row">
                        <span>${displayDate(day.date)}</span>
                        <span>外資 <b>${signedLots(day.shares)}</b></span>
                        <span></span>
                      </div>
                    `).join("")}
                  </div>
                ` : ""}
                ${row.trustStreak.length >= 2 ? `
                  <div class="stock-list-daily">
                    <div class="stock-list-daily-title">投信連買 ${row.trustStreak.length} 天</div>
                    ${row.trustStreak.map((day) => `
                    <div class="stock-list-daily-row">
                      <span>${displayDate(day.date)}</span>
                      <span>投信 <b>${signedLots(day.shares)}</b></span>
                      <span></span>
                    </div>
                  `).join("")}
                  </div>
                ` : ""}
              </div>
            `).join("")}
          </article>
        `;
      } catch (error) {
        els.maCrossResult.innerHTML = `<div class="panel empty">${error.message || "法人連買掃描失敗"}</div>`;
        throw error;
      }
    }

    function parseEtfHoldingChanges(markdown) {
      const sectionMatch = markdown.match(/## \u6301\u80a1\u8b8a\u5316\s+([\s\S]*?)(?=\n## )/);
      if (!sectionMatch) throw new Error("00981A 持股變化資料格式異常");
      const section = sectionMatch[1];
      const date = section.match(/(20\d{2}-\d{2}-\d{2})/)?.[1] || "--";
      const changes = section.split("\n")
        .filter((line) => /^\|\s*[^-]/.test(line) && !line.includes("代號") && !line.includes("當日股數"))
        .map((line) => line.split("|").slice(1, -1).map((cell) => cell.trim()))
        .filter((cells) => cells.length >= 5 && /^\d{4,6}$/.test(cells[0]) && /^[+-]/.test(cells[4]))
        .map((cells) => ({
          code: cells[0],
          name: cells[1],
          change: cells[4].replace(/\*\*/g, ""),
          direction: cells[4].startsWith("+") ? "buy" : "sell",
        }));
      return { date, changes };
    }

    function renderEtfChangeGroup(title, tone, rows) {
      return `
        <article class="panel etf-change-card ${tone}">
          <h3>${title} ${rows.length} 檔</h3>
          ${rows.length ? rows.map((row) => `
            <div class="etf-change-row">
              <span>${row.code}</span>
              <strong>${row.name}</strong>
              <b>${row.change}</b>
            </div>
          `).join("") : `<div class="empty">當日無此類異動</div>`}
        </article>
      `;
    }

    async function showEtfHoldingChanges() {
      els.etfChangeResult.innerHTML = `<div class="panel empty">正在取得 00981A 最新持股變化…</div>`;
      try {
        const response = await fetch(ETF_CHANGE_SOURCE);
        if (!response.ok) throw new Error(`00981A 持股變化暫時無法取得（HTTP ${response.status}）`);
        const { date, changes } = parseEtfHoldingChanges(await response.text());
        const buys = changes.filter((row) => row.direction === "buy");
        const sells = changes.filter((row) => row.direction === "sell");
        els.etfChangeResult.innerHTML = `
          <div class="compact-list-head panel">
            <div class="card-sub">資料日 ${date}。張數為相鄰兩個持股日的公開持股股數差，可能受基金申購／買回影響，不等於經理人逐筆成交量。</div>
            <span class="badge good">${changes.length} 檔異動</span>
          </div>
          <div class="etf-change-grid">
            ${renderEtfChangeGroup("買進／增持", "buy", buys)}
            ${renderEtfChangeGroup("賣出／減持", "sell", sells)}
          </div>
          <div class="data-notice">來源：公開持股整理資料 · <a href="https://zdsetf.com/etf/00981A" target="_blank" rel="noopener noreferrer">查看完整資料</a></div>
        `;
      } catch (error) {
        els.etfChangeResult.innerHTML = `<div class="panel empty">${error.message || "00981A 持股變化更新失敗"}<br><a href="https://zdsetf.com/etf/00981A" target="_blank" rel="noopener noreferrer">改至資料頁查看</a></div>`;
        throw error;
      }
    }

    async function refreshAllInformation() {
      els.refreshAll.disabled = true;
      els.refreshAll.classList.add("is-loading");
      els.refreshAll.setAttribute("aria-busy", "true");
      els.refreshAll.textContent = "資料更新中…";
      els.maCrossResult.innerHTML = `<div class="panel empty">正在掃描外資投信連買…</div>`;
      els.etfChangeResult.innerHTML = `<div class="panel empty">正在取得 00981A 持股變化…</div>`;

      try {
        const results = await Promise.allSettled([showConsecutiveBuys(), showEtfHoldingChanges()]);
        if (results.every((result) => result.status === "rejected")) throw results[0].reason;
        const summary = results.some((result) => result.status === "rejected") ? "部分資料更新失敗" : "全部更新完成";
        els.status.textContent = `${summary} · ${new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false })}`;
      } catch (error) {
        els.status.textContent = error.message || "外資投信連買更新失敗";
      } finally {
        els.refreshAll.disabled = false;
        els.refreshAll.classList.remove("is-loading");
        els.refreshAll.removeAttribute("aria-busy");
        els.refreshAll.textContent = "更新全部資訊";
      }
    }

    els.status.textContent = "按下更新按鈕，取得最新排行。";
    els.refreshAll.addEventListener("click", refreshAllInformation);
  </script>
</body>
</html>
