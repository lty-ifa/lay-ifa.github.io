<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股籌碼雷達</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #101827;
      --ink: #eef6ff;
      --muted: #91a0b5;
      --line: #26354a;
      --green: #35d39a;
      --red: #ff6b81;
      --blue: #5bbcff;
      --amber: #f6c85f;
      --purple: #9f8cff;
      --soft-green: #102a24;
      --soft-red: #2b1820;
      --soft-blue: #13263a;
      --soft-amber: #2d2819;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      padding: 10px 2px 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 16px;
    }

    .brand-copy {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding-left: 16px;
      border-left: 1px solid rgba(91, 188, 255, 0.3);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: #181b20;
    }

    .subline {
      color: #596273;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .data-notice {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border: 1px solid rgba(242, 184, 91, 0.42);
      border-radius: 999px;
      color: #e8bd73;
      background: rgba(242, 184, 91, 0.09);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .page-notice {
      display: flex;
      justify-content: center;
      margin-top: 24px;
      padding: 4px 0 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(91, 188, 255, 0.38);
      border-radius: 9px;
      color: #dff6ff;
      background: rgba(91, 188, 255, 0.08);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .home-link:hover {
      border-color: rgba(91, 188, 255, 0.75);
      background: rgba(91, 188, 255, 0.15);
      transform: translateY(-1px);
    }

    .live-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font: 750 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-mark::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 16px currentColor;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    .dashboard-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .dashboard-controls h2 {
      margin: 0;
      color: #181b20;
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -0.01em;
    }

    .result-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .dashboard-controls p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .refresh-all {
      min-width: 180px;
      background: #1f3a5f;
      border: 1px solid #1f3a5f;
      box-shadow: none;
    }

    .result-section {
      scroll-margin-top: 18px;
      margin-top: 20px;
      padding: 0;
      border: 0;
      border-radius: 0;
      overflow: visible;
      background: none;
    }

    .strong-zone {
      box-shadow: none;
    }

    .result-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 28px 2px 10px;
      padding-bottom: 9px;
      border-bottom: 2px solid #1f3a5f;
    }

    .result-heading span {
      color: #6b7280;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .strong-zone .result-title { color: #181b20; }

    .strong-zone .rank-no { color: #6b7280; }

    .hidden-controls { display: none; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 16px;
      position: sticky;
      top: 14px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 11px;
      color: var(--ink);
      background: #ffffff;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #e7ebf0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-2.is-single {
      grid-template-columns: 1fr;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .primary, .secondary {
      min-height: 44px;
      border-radius: 9px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 800;
      border: 0;
      color: #fff;
      transition: filter 0.16s ease, transform 0.16s ease;
    }

    .primary {
      background: var(--blue);
    }

    .secondary {
      background: #1f3a5f;
    }

    .action-query { background: var(--blue); }
    .action-strong { background: var(--green); }

    .primary.is-active,
    .secondary.is-active {
      box-shadow: 0 0 0 3px #e7ebf0;
      filter: brightness(0.95);
    }

    .mode-form {
      display: none;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .mode-form.is-open {
      display: block;
    }

    .mode-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 850;
    }

    .field.is-hidden {
      display: none;
    }

    .execute-button {
      width: 100%;
      margin-top: 2px;
    }

    .primary:hover:not(:disabled),
    .secondary:hover:not(:disabled) {
      filter: brightness(0.94);
      transform: translateY(-1px);
    }

    .primary:disabled,
    .secondary:disabled {
      cursor: progress;
    }

    .status {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 12px;
      min-height: 44px;
      border-left: 3px solid #1f3a5f;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      min-height: 92px;
      padding: 14px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 24px;
      overflow-wrap: anywhere;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .neutral { color: var(--muted); }

    .card {
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: none;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      color: #181b20;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.015em;
    }

    .card-sub {
      color: #596273;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 550;
      margin-top: 5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.good {
      color: var(--green);
      border-color: #087a55;
      background: var(--soft-green);
    }

    .badge.bad {
      color: var(--red);
      border-color: #c2414b;
      background: var(--soft-red);
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    .cell {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      padding: 10px;
      min-height: 70px;
    }

    .cell span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .cell strong {
      display: block;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .signal {
      border-left: 5px solid var(--blue);
      background: #ffffff;
    }

    .signal.good {
      border-left-color: var(--green);
      background: #ffffff;
    }

    .signal.bad {
      border-left-color: var(--red);
      background: #ffffff;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .context-box {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      padding: 11px;
    }

    .context-box span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .context-box strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .context-box p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .ranking {
      display: grid;
      gap: 8px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 10px;
      align-items: center;
      border: 2px solid #c8cdd4;
      border-radius: 7px;
      padding: 12px;
      background: #ffffff;
    }

    .rank-row.strong-detail {
      grid-template-columns: 54px minmax(0, 1fr);
      align-items: start;
    }

    .rank-no {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .rank-main strong,
    .rank-side strong {
      display: block;
    }

    .rank-main > strong {
      color: #181b20;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 900;
    }

    .rank-main span,
    .rank-side span {
      color: var(--muted);
      font-size: 12px;
    }

    .strong-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .strong-cell {
      border: 1px solid #e3e3df;
      border-radius: 6px;
      padding: 10px;
      background: #f8f8f6;
      min-height: 58px;
    }

    .signal-hero {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .hero-stat {
      padding: 12px;
      border: 1px solid #d7dce3;
      border-radius: 7px;
      background: #ffffff;
    }

    .hero-stat.primary-stat {
      border-left: 4px solid #1f3a5f;
    }

    .hero-stat span,
    .group-value span,
    .financing-row span {
      display: block;
      color: #596273;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .hero-stat strong {
      display: block;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .streak-days {
      color: #ff9f43;
    }

    .detail-groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .detail-group {
      padding: 10px;
      border: 1px solid #e3e3df;
      border-radius: 7px;
      background: #f8f8f6;
    }

    .detail-group h4 {
      margin: 0 0 8px;
      color: #181b20;
      font-size: 13px;
      font-weight: 900;
    }

    .group-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .streak-values {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .group-value strong {
      display: block;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .financing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      padding: 8px 10px;
      border-top: 1px solid #deded9;
    }

    .financing-row span { margin: 0; }
    .financing-row strong { font-size: 13px; }

    .strong-cell > span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .strong-cell strong {
      display: block;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .strong-split {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .strong-split b {
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 36px 18px;
      color: var(--muted);
    }

    /* Dark technology theme */
    h1,
    .dashboard-controls h2,
    .card-title,
    .rank-main > strong,
    .detail-group h4 {
      color: #eef6ff;
    }

    .subline,
    .card-sub,
    .result-heading span,
    .strong-zone .rank-no,
    .hero-stat span,
    .group-value span,
    .financing-row span {
      color: #91a0b5;
    }

    .refresh-all,
    .primary,
    .secondary {
      color: #070b14;
      background: #5bbcff;
      border-color: #5bbcff;
      box-shadow: none;
    }

    .result-heading {
      border-bottom-color: #5bbcff;
    }

    .strong-zone .result-title {
      color: #eef6ff;
    }

    input,
    .badge,
    .cell,
    .context-box,
    .signal,
    .signal.good,
    .signal.bad,
    .hero-stat {
      color: #eef6ff;
      background: #101827;
      border-color: #26354a;
    }

    input:focus,
    .primary.is-active,
    .secondary.is-active {
      box-shadow: 0 0 0 3px #13263a;
    }

    .status {
      border-left-color: #5bbcff;
    }

    .badge.good {
      color: #35d39a;
      border-color: #35d39a;
      background: #102a24;
    }

    .badge.bad {
      color: #ff6b81;
      border-color: #ff6b81;
      background: #2b1820;
    }

    .rank-row {
      border-color: #34465e;
      background: #0d1522;
    }

    .strong-cell,
    .detail-group {
      color: #eef6ff;
      border-color: #26354a;
      background: #0d1522;
    }

    .hero-stat.primary-stat {
      border-left-color: #5bbcff;
    }

    .financing-row {
      border-top-color: #26354a;
    }

    /* Lighter typography */
    body { font-weight: 400; }
    h1 { font-weight: 600; }
    strong, b { font-weight: 600; }

    .dashboard-controls h2,
    .result-title,
    .card-title,
    .rank-main > strong,
    .hero-stat strong,
    .detail-group h4 {
      font-weight: 700;
    }

    .subline,
    .dashboard-controls p,
    .card-sub,
    .status {
      font-weight: 400;
    }

    button,
    .badge,
    .rank-no,
    .group-value strong,
    .financing-row strong {
      font-weight: 600;
    }

    .result-heading span,
    .hero-stat span,
    .group-value span,
    .financing-row span,
    .strong-cell > span {
      font-weight: 500;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .controls { position: static; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .data-grid, .strong-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .app { width: min(100% - 16px, 1120px); padding: 10px 0 28px; }
      .topbar { align-items: flex-end; margin-bottom: 14px; padding: 8px 4px 14px; }
      .brand-lockup { display: grid; gap: 7px; }
      .brand-copy { gap: 7px; padding-left: 0; border-left: 0; }
      h1 { font-size: 28px; }
      .subline { font-size: 10px; }
      .data-notice { padding: 4px 7px; font-size: 9px; }
      .header-actions { gap: 0; }
      .home-link { min-height: 32px; padding: 0 10px; font-size: 11px; }
      .card-head { flex-direction: column; align-items: stretch; }
      .live-mark { display: none; }
      .grid-2, .actions, .data-grid, .context-grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .metric { min-height: 72px; padding: 11px; }
      .metric strong { font-size: 17px; margin-top: 3px; }
      .metric span { font-size: 10px; }
      .status { font-size: 12px; min-height: 40px; margin-bottom: 8px; }
      .result-section { margin-top: 14px; padding: 0; border-radius: 0; }
      .result-heading { align-items: baseline; padding: 0 3px; }
      .result-title { font-size: 19px; }
      .result-heading span { font-size: 9px; }
      .card { padding: 12px 8px; }
      .card-title { font-size: 18px; }
      .card-sub { font-size: 11px; line-height: 1.45; }
      .ranking { gap: 7px; }
      .rank-row, .rank-row.strong-detail { grid-template-columns: 30px minmax(0, 1fr); gap: 5px; padding: 8px 6px; }
      .rank-no { font-size: 11px; }
      .strong-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .strong-cell { padding: 8px; min-height: 56px; }
      .strong-cell > span { font-size: 10px; }
      .strong-cell strong, .strong-split b { font-size: 12px; }
      .signal-hero { gap: 6px; }
      .hero-stat { padding: 10px 8px; }
      .hero-stat strong { font-size: 20px; }
      .detail-groups { grid-template-columns: 1fr; gap: 6px; }
      .detail-group { padding: 8px; }
      .group-values { gap: 6px; }
      .group-value strong { font-size: 13px; }
      .rank-side { grid-column: 2; }
      .dashboard-controls { align-items: stretch; flex-direction: column; gap: 12px; padding: 14px; margin-bottom: 10px; }
      .dashboard-controls p { font-size: 12px; }
      .refresh-all { width: 100%; min-height: 48px; }
    }

    /* Neon technology theme */
    body {
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 4%, rgba(0, 229, 255, 0.14), transparent 28rem),
        radial-gradient(circle at 90% 18%, rgba(112, 92, 255, 0.12), transparent 26rem),
        linear-gradient(145deg, #050914 0%, #080f1d 48%, #050a13 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(91, 188, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 188, 255, 0.1) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
    }

    .app { position: relative; z-index: 1; }

    .topbar {
      border-bottom-color: rgba(91, 188, 255, 0.5);
      box-shadow: 0 14px 28px -24px rgba(0, 229, 255, 0.9);
    }

    h1 {
      color: #f4fbff;
      background: linear-gradient(90deg, #fff, #8eeaff 58%, #aea5ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 28px rgba(91, 188, 255, 0.2);
    }

    .subline { color: #90a9c5; }
    .live-mark { text-shadow: 0 0 12px rgba(53, 211, 154, 0.65); }

    .live-mark::before {
      box-shadow: 0 0 7px currentColor, 0 0 22px currentColor;
      animation: neonPulse 2.2s ease-in-out infinite;
    }

    .panel,
    .rank-row,
    .cell,
    .context-box,
    .strong-cell,
    .hero-stat,
    .detail-group {
      background: linear-gradient(145deg, rgba(18, 29, 47, 0.96), rgba(9, 17, 31, 0.96));
      border-color: rgba(91, 188, 255, 0.25);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .panel:hover,
    .rank-row:hover {
      border-color: rgba(91, 188, 255, 0.52);
      box-shadow: 0 0 24px rgba(41, 176, 255, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .dashboard-controls {
      border-color: rgba(91, 188, 255, 0.44);
      box-shadow: 0 0 28px rgba(25, 154, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .dashboard-controls h2,
    .result-title,
    .strong-zone .result-title,
    .card-title,
    .rank-main > strong,
    .detail-group h4 { color: #eef8ff; }

    .card-sub,
    .hero-stat span,
    .group-value span,
    .financing-row span { color: #8fa5be; }

    .result-heading {
      border-bottom-color: rgba(91, 188, 255, 0.62);
      box-shadow: 0 12px 22px -22px #5bbcff;
    }

    .result-heading span {
      color: #68cfff;
      text-shadow: 0 0 10px rgba(91, 188, 255, 0.45);
    }

    .refresh-all,
    .primary {
      background: linear-gradient(135deg, #126ba5, #604fd1);
      border: 1px solid rgba(118, 220, 255, 0.62);
      box-shadow: 0 0 20px rgba(38, 176, 255, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .refresh-all.is-loading::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 9px;
      vertical-align: -2px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: loadingSpin 0.7s linear infinite;
    }

    .signal,
    .signal.good,
    .signal.bad { background: rgba(9, 18, 32, 0.96); }

    @keyframes neonPulse {
      0%, 100% { opacity: 0.65; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes loadingSpin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .live-mark::before,
      .refresh-all.is-loading::before { animation: none; }
    }

    /* Clear visual separation between the two ranking zones */
    .result-section {
      position: relative;
      margin-top: 30px;
      padding: 20px;
      overflow: hidden;
      border: 1px solid rgba(91, 188, 255, 0.34);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(8, 24, 40, 0.82), rgba(6, 13, 25, 0.9));
      box-shadow: 0 0 34px rgba(39, 190, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .result-section::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: #55dfff;
      box-shadow: 0 0 10px #55dfff, 0 0 24px rgba(85, 223, 255, 0.7);
    }

    .result-section::after {
      content: "";
      position: absolute;
      top: -120px;
      right: -100px;
      width: 260px;
      height: 260px;
      pointer-events: none;
      border-radius: 50%;
      background: rgba(42, 189, 255, 0.11);
      filter: blur(40px);
    }

    .result-section .result-heading {
      position: relative;
      z-index: 1;
      margin: 0 0 16px;
      padding: 0 0 13px;
    }

    .strong-zone .result-heading { border-bottom-color: rgba(85, 223, 255, 0.7); }

    .result-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-title::before {
      content: "01";
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 26px;
      padding: 0 6px;
      border: 1px solid rgba(85, 223, 255, 0.62);
      border-radius: 6px;
      color: #87eaff;
      background: rgba(18, 104, 139, 0.24);
      box-shadow: 0 0 14px rgba(85, 223, 255, 0.17);
      font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
    }

    .result-section > div:not(.result-heading) {
      position: relative;
      z-index: 1;
    }

    .compact-list {
      overflow: hidden;
      border: 1px solid rgba(91, 188, 255, 0.26);
      border-radius: 12px;
      background: rgba(8, 16, 29, 0.72);
    }

    .compact-list-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 15px;
      border-bottom: 1px solid rgba(91, 188, 255, 0.22);
    }

    .compact-list-head .card-sub { min-width: 0; }

    .stock-list-row {
      display: grid;
      grid-template-columns: 42px minmax(130px, 180px) minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 14px 15px;
      border-bottom: 1px solid rgba(143, 165, 190, 0.16);
    }

    .stock-list-row:last-child { border-bottom: 0; }

    .stock-list-rank {
      color: #68cfff;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .stock-list-name strong {
      display: block;
      color: #eef8ff;
      font-size: 15px;
      white-space: nowrap;
    }

    .stock-list-name { min-width: 0; }

    .stock-list-name span {
      display: block;
      margin-top: 3px;
      color: #91a0b5;
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .stock-list-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 10px 14px;
      min-width: 0;
    }

    .stock-list-metric { min-width: 0; }

    .stock-list-metric span {
      display: block;
      margin-bottom: 2px;
      color: #8293a9;
      font-size: 10px;
    }

    .stock-list-metric strong {
      display: block;
      color: #e8f1fb;
      font-size: 12px;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
    }

    .stock-list-metric.flow-summary { grid-column: 1 / -1; }

    .stock-list-metric strong.positive { color: #5fe6a9; }
    .stock-list-metric strong.negative { color: #ff7f96; }

    .stock-list-market {
      min-height: 42px;
      padding: 6px 8px 6px 10px;
      border-left: 3px solid;
      border-radius: 0 6px 6px 0;
    }

    .stock-list-market.price-status {
      border-left-color: #f2b85b;
      background: linear-gradient(90deg, rgba(242, 184, 91, 0.12), transparent);
    }

    .stock-list-market.volume-status {
      border-left-color: #8d8bff;
      background: linear-gradient(90deg, rgba(141, 139, 255, 0.12), transparent);
    }

    .stock-list-market.price-status > span { color: #e8bd73; }
    .stock-list-market.volume-status > span { color: #aaa8ff; }

    .stock-list-daily {
      grid-column: 1 / -1;
      overflow: hidden;
      border: 1px solid rgba(91, 188, 255, 0.18);
      border-radius: 7px;
      background: rgba(7, 15, 27, 0.42);
    }

    .stock-list-daily-title {
      padding: 6px 9px;
      color: #8fc8e8;
      font-size: 10px;
      font-weight: 600;
      border-bottom: 1px solid rgba(91, 188, 255, 0.14);
    }

    .stock-list-daily-row {
      display: grid;
      grid-template-columns: 72px repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 5px 9px;
      color: #dce9f5;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px solid rgba(143, 165, 190, 0.1);
    }

    .stock-list-daily-row:last-child { border-bottom: 0; }
    .stock-list-daily-row span { min-width: 0; white-space: nowrap; }
    .stock-list-daily-row span:first-child { color: #8293a9; }
    .stock-list-daily-row b { color: #5fe6a9; font-weight: 600; }

    @media (max-width: 820px) {
      .stock-list-row {
        grid-template-columns: 34px minmax(0, 1fr);
        align-items: start;
      }
      .stock-list-metrics {
        grid-column: 2;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .result-section { margin-top: 18px; padding: 12px 8px 10px; border-radius: 13px; }
      .result-section .result-heading { padding: 0 0 11px; }
      .result-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: 4px;
      }
      .result-title { gap: 7px; line-height: 1.35; }
      .result-title::before { min-width: 30px; height: 24px; }
      .result-heading > span { padding-left: 37px; }
      .compact-list-head {
        align-items: flex-start;
        flex-direction: column;
        padding: 11px 12px;
      }
      .stock-list-row {
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
        padding: 13px 10px;
      }
      .stock-list-name strong {
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.35;
      }
      .stock-list-metrics {
        grid-column: 2;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        width: 100%;
      }
      .stock-list-metric strong {
        font-size: 12px;
        overflow-wrap: normal;
        word-break: keep-all;
      }
      .stock-list-market {
        grid-column: auto;
        width: 100%;
        min-height: 0;
        box-sizing: border-box;
      }
      .dashboard-controls { align-items: stretch; flex-direction: column; }
      .dashboard-controls .refresh-all { width: 100%; }
      .stock-list-daily-row {
        grid-template-columns: 50px repeat(2, minmax(0, 1fr));
        gap: 5px;
        padding: 5px 7px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-lockup">
        <h1>台股籌碼雷達</h1>
        <div class="brand-copy">
          <div class="subline">季線突破 · 成交量確認 · EPS／本益比</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="live-mark">Market Intelligence</div>
        <a class="home-link" href="index.html">回首頁</a>
      </div>
    </header>

    <section class="layout">
      <section>
        <div class="panel dashboard-controls">
          <div>
            <h2>每日季線掃描</h2>
            <p>找出成交量超過千張、剛站上季線的股票，並列出 EPS 與本益比。</p>
          </div>
          <button id="refreshAllButton" class="primary refresh-all">更新季線突破</button>
        </div>

        <div class="panel status" id="statusText">按下更新按鈕，取得最新排行。</div>

        <section class="result-section strong-zone" aria-labelledby="maCrossResultTitle">
          <div class="result-heading">
            <h2 class="result-title" id="maCrossResultTitle">放量突破季線</h2>
            <span>MA60 BREAKOUT</span>
          </div>
          <div id="maCrossResult"><div class="panel empty">尚未更新</div></div>
        </section>

      </section>
    </section>
    <footer class="page-notice">
      <div class="data-notice">公開資料整理，僅供參考使用</div>
    </footer>
  </main>

  <script>
    const TRADINGVIEW_SCAN_API = "https://scanner.tradingview.com/taiwan/scan";

    const els = {
      status: document.getElementById("statusText"),
      refreshAll: document.getElementById("refreshAllButton"),
      maCrossResult: document.getElementById("maCrossResult"),
    };

    function fmtNum(value) {
      if (!Number.isFinite(value)) return "--";
      return new Intl.NumberFormat("zh-TW").format(Math.round(value));
    }

    function fmtPct(value) {
      return Number.isFinite(value) ? `${value.toFixed(2)}%` : "--";
    }

    function fmtPrice(value) {
      return Number.isFinite(value)
        ? new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 2 }).format(value)
        : "--";
    }

    function isEtfLikeCode(code) {
      return !/^\d{4}$/.test(code) || code.startsWith("00");
    }

    async function fetchMa60Breakouts() {
      const payload = {
        filter: [
          { left: "type", operation: "equal", right: "stock" },
          { left: "exchange", operation: "in_range", right: ["TWSE", "TPEX"] },
        ],
        options: { lang: "zh_TW" },
        markets: ["taiwan"],
        symbols: { query: { types: [] }, tickers: [] },
        columns: [
          "name",
          "description",
          "exchange",
          "close",
          "SMA60",
          "close[1]",
          "SMA60[1]",
          "volume",
          "earnings_per_share_diluted_ttm",
          "price_earnings_ttm",
        ],
        range: [0, 3000],
      };
      const response = await fetch(TRADINGVIEW_SCAN_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error(`季線掃描暫時無法取得（HTTP ${response.status}）`);
      const data = await response.json();
      if (!Array.isArray(data?.data)) throw new Error("季線掃描資料格式異常");

      const universe = data.data.map(({ d }) => ({
        code: String(d[0] || "").trim(),
        name: String(d[1] || "").trim(),
        exchange: String(d[2] || "").trim(),
        close: Number(d[3]),
        ma60: Number(d[4]),
        previousClose: Number(d[5]),
        previousMa60: Number(d[6]),
        volume: Number(d[7]),
        eps: d[8] == null ? null : Number(d[8]),
        pe: d[9] == null ? null : Number(d[9]),
      })).filter((row) => /^\d{4}$/.test(row.code) && !isEtfLikeCode(row.code));

      return universe
        .filter((row) =>
          Number.isFinite(row.close)
          && Number.isFinite(row.ma60)
          && Number.isFinite(row.previousClose)
          && Number.isFinite(row.previousMa60)
          && row.close >= row.ma60 * 1.01
          && row.previousClose <= row.previousMa60
          && row.volume > 1000000
        )
        .map((row) => ({
          ...row,
          aboveMaPct: (row.close / row.ma60 - 1) * 100,
        }))
        .sort((a, b) => b.volume - a.volume);
    }

    async function showMa60Breakouts() {
      els.maCrossResult.innerHTML = `<div class="panel empty">正在掃描季線突破與 EPS 資料…</div>`;
      try {
        const rows = await fetchMa60Breakouts();
        if (!rows.length) {
          els.maCrossResult.innerHTML = `<div class="panel empty">目前沒有同時符合「剛突破季線 1%」與「成交量超過 1,000 張」的股票</div>`;
          return;
        }
        els.maCrossResult.innerHTML = `
          <article class="compact-list">
            <div class="compact-list-head">
              <div class="card-sub">今日收盤至少高於 MA60 1%、昨日尚未站上 MA60，且今日成交量超過 1,000 張。EPS 為近四季稀釋每股盈餘，本益比為目前股價除以 EPS。</div>
              <span class="badge good">${rows.length} 檔符合</span>
            </div>
            ${rows.map((row, index) => `
              <div class="stock-list-row">
                <div class="stock-list-rank">#${index + 1}</div>
                <div class="stock-list-name">
                  <strong>${row.code} ${row.name}</strong>
                  <span>${row.exchange === "TWSE" ? "上市" : "上櫃"} · 成交量 ${fmtNum(row.volume / 1000)} 張</span>
                </div>
                <div class="stock-list-metrics">
                  <div class="stock-list-metric stock-list-market price-status"><span>股價／季線</span><strong class="positive">${fmtPrice(row.close)}／${fmtPrice(row.ma60)} · 高 ${fmtPct(row.aboveMaPct)}</strong></div>
                  <div class="stock-list-metric stock-list-market volume-status"><span>EPS／本益比</span><strong>${Number.isFinite(row.eps) ? row.eps.toFixed(2) : "--"} 元／${Number.isFinite(row.pe) && row.pe > 0 ? `${row.pe.toFixed(1)} 倍` : "--"}</strong></div>
                </div>
              </div>
            `).join("")}
          </article>
        `;
      } catch (error) {
        els.maCrossResult.innerHTML = `<div class="panel empty">${error.message || "季線掃描失敗"}</div>`;
        throw error;
      }
    }

    async function refreshAllInformation() {
      els.refreshAll.disabled = true;
      els.refreshAll.classList.add("is-loading");
      els.refreshAll.setAttribute("aria-busy", "true");
      els.refreshAll.textContent = "資料更新中…";
      els.maCrossResult.innerHTML = `<div class="panel empty">正在掃描季線突破…</div>`;

      try {
        await showMa60Breakouts();
        els.status.textContent = `季線突破更新完成 · ${new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false })}`;
      } catch (error) {
        els.status.textContent = error.message || "季線突破更新失敗";
      } finally {
        els.refreshAll.disabled = false;
        els.refreshAll.classList.remove("is-loading");
        els.refreshAll.removeAttribute("aria-busy");
        els.refreshAll.textContent = "更新季線突破";
      }
    }

    els.status.textContent = "按下更新按鈕，取得最新排行。";
    els.refreshAll.addEventListener("click", refreshAllInformation);
  </script>
</body>
</html>
